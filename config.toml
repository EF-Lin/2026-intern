# data.py / plot_*_hist.py 使用的設定
# 光纖段落以 (起始測站, 測站數) 表示，對應 Search.multi_find(station, n)

[search]
# 資料放在 data/<日期>/：20260708 (julday 189)、20260728 (julday 209)、20261101 (julday 305)
folder = "data/20260708"
# 檔名模板，可含子資料夾；省略時為 "TW.{num}..S.D.{year}.{julday}"（所有檔案放同一層）
# 遠端 archive：folder = "/ceph/midas/seiscomp/var/lib/archive"
#               filename = "{year}/TW/{num}/S.D/TW.{num}..S.D.{year}.{julday}"
year = 2026
julday = 189

[events]
main = ["2026-07-08T15:47:32"]
times = [
    "2026-07-08T14:27:12",
    "2026-07-08T15:38:54",
    "2026-07-08T16:21:14",
    "2026-07-08T19:27:34",
    "2026-07-08T19:52:26",
    "2026-07-08T19:53:03",
    "2026-07-08T20:56:46",
    "2026-07-08T21:28:10",
]
fk_csv = "asset/20260708/ups.csv"

[segments]
A = { station = 1208, n = 170 }
A_up = { station = 1378, n = 170 }  # Hole A 往上段 1378（底部，與 A 共用）–1548（井口）
B = { station = 650, n = 122 }
full = { station = 1559, n = 25 }
N-S = { station = 1559, n = 5 }
NE-SW = { station = 1564, n = 7 }
SW-NE = { station = 1571, n = 7 }
E-W = { station = 1578, n = 6 }
fk = { station = 1213, n = 165 }
h5 = { station = 1258, n = 120 }

[draw]
station = 1559
figsize = [30, 4]

[mini_2_h5]
segment = "h5"
start = 200

[pn]
h5 = "data/2026-07-08.h5"

[fk]
segment = "fk"
start = 20
cut = 2
pad = 30  # 前後多讀的秒數，處理（taper/濾波）後再切掉

[updown]
segment = "A"        # Hole A 往下段（通道 1208–1378）；改 "B" 為 Hole B
label = "Hole A"     # 圖片標題用的名稱；改跑 Hole B 時一併改成 "Hole B"
csv = ""             # 留空用 events.main；填 "asset/20260708/ups.csv" 跑該表所有事件
start = 0            # 第一個通道的深度 (m)
spacing = 4.0        # 通道間距 (m)
cut = 2
pad = 30
frequency = [1, 20]  # 帶通濾波 (Hz)
scale = 0.99         # 色階取原始資料 |振幅| 的百分位
v_min = 500          # 選填：濾掉視速度低於此值 (m/s) 的能量（f-k 圖水平軸 f=0 附近的楔形）
v_max = 8000         # 選填：濾掉視速度高於此值 (m/s) 的能量（f-k 圖垂直軸 k=0 附近的楔形）
v_taper = 10000      # 上行 / 下行在 k=0 的分界用 cosine 漸變，視速度高於此值的能量兩邊平分；刪掉則硬切
taper = 0.2          # v_min / v_max 楔形邊緣的漸變寬度（慢度的相對比例），0 = 硬切
figsize = [12, 3]
fk = true            # 另存 f-k 頻譜圖，檢查分離效果
stack_legs = false   # true：U 型光纖往下段 + 往上段（反轉後對齊深度）平均，提高 S/N；圖檔名變成 {segment 起點}_to_{up_segment 終點}
up_segment = "A_up"  # 往上段，第一個通道須為底部轉折點
leg_offset = 0       # 往上段的通道位移（正 = 往深處移），可依下行印出的最佳位移調整
shift_window = [-0.2, 1.3]  # 估計位移用的時間窗（相對事件秒數），刪掉則不估計
max_shift = 10       # 估計位移時搜尋 ±幾個通道

[updown.wiggle]      # 原始 / 上行 / 下行 波形疊圖（並排），刪掉此區塊即不輸出
window = [-0.2, 1.3]  # 相對事件時間的秒數
every = 4             # 每幾道取 1 道
gain = 1.5            # 振幅放大倍率（1 = 最大振幅剛好碰到相鄰道）
per_trace = false     # true：每道各自正規化；false：三張共用原始資料的振幅比例
color = ["black", "red", "blue"]
figsize = [5, 9]      # 單張大小

[web]                # 可視化網站（web/）的資料輸出；網頁只讀 web/data/<day>/，不碰 MiniSEED
out = "web/data"
day = "20260708"     # 輸出資料夾名稱
geometry = "asset/fiber_geometry.csv"  # 通道 ↔ 經緯度錨點，可手改
every = 5            # 每幾個通道合成一個站點（取 RMS 最大值）
leg_offset = 12      # 折返光纖兩條腿在圖上左右各偏移幾公尺
frequency = [1, 20]  # 帶通濾波 (Hz)，與 [updown] 相同
event_fs = 50        # 事件窗波形的取樣率 (Hz)
event_half = 15      # 事件窗：事件前後各幾秒存波形（每個事件約 1 MB；±300 s 約 20 MB）
event_clip = [0, 15]  # 事件色階上限 = 發生時間後這段（秒）所有站 |振幅| 的第 99 百分位
events = []          # 另外要存波形的事件（UTC）；15:47:32 與 ups.csv 的 15:47:28 是同一個主震，不重複存
events_csv = "asset/20260708/ups.csv"  # 再加入此表 Time 欄的事件（UTC）；留空則不用
main_shock = "2026-07-08T15:47:28"  # 網頁以橘色標記的主震（須在上面的事件中）；留空則不標
counts_to_strain_rate = 0  # counts → ε/s 換算係數；0 = 未知，網頁以 counts 標示
workers = 6          # web_day 同時處理幾個通道檔（每個約 300 MB 記憶體）
cache = "web/cache"  # web_day 的中間結果（float16 RMS + 壓縮事件波形，0708 約 150–200 MB）；留空則每次全部重算

[web.arrivals]       # 事件初達時間 + 平面波擬合（src/web/arrivals.py），結果寫進 meta.json events[k].arrivals
                     # 真實資料：挑時與擬合在 100 Hz 原始取樣（濾波後）上做，之後才降到 event_fs 存波形；demo 只有 50 Hz
half = 2             # 挑時前先把每個站點與同段光纖前後各幾個站點平均（提高訊噪比）
pos_sigma = 100      # 通道位置不確定度 (m)，用來估計方位角的 ± 值
skip = false         # true = 不做

[web.demo]           # web_demo：不讀 MiniSEED 的合成資料，格式與真實輸出相同
day = "demo"
start = "2026-07-08T00:00:00"
channels = [55, 1631]  # 模擬 0708 有下載的通道範圍，範圍外的站點顯示為無資料
event_half = 300     # demo 事件窗（秒），與真實資料分開
seed = 0
# 假地震：azimuth = 震源方位（度，北起順時針，由測站看向震源），distance = 震央距 (m)，depth = 深度 (m)
events = [
    { time = "2026-07-08T03:20:05", mag = 2.2, azimuth = 30, distance = 8000, depth = 5000 },
    { time = "2026-07-08T07:47:32", mag = 2.8, azimuth = 200, distance = 15000, depth = 10000 },
    { time = "2026-07-08T13:05:41", mag = 1.8, azimuth = 290, distance = 5000, depth = 3000 },
]

[compareAB]
station_a = 1333
station_b = 772
start = 500
cut = 2
output = "image/data.csv"

[hist]
csv = "image/data.csv"
highlight_time = "2026-07-08T15:47:32"

[hist.lags_AB]
binwidth = 10
symbol = "lags"
fmt = ".0f"
xlabel = "Lags (10 ms)"
title = "Distribution of Lags$_{AB}$"
output = "image/lags_AB_histogram.png"

[hist.v_ap]
binwidth = 100
symbol = "$v_{ap}$"
unit = "m/s"
xlabel = "Apparent Velocity $v_{ap}$ (m/s)"
title = "Distribution of Apparent Velocities"
output = "image/v_ap_histogram_sci-t.png"
